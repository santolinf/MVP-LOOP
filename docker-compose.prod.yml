# Production-style stack: Postgres + one-shot migration + the app (API, web, admin, worker in one container).
# No seeding and no local backing services (MinIO / scanner / Mailpit) by design. Object storage is any private
# S3-compatible bucket and malware scanning is any host of the infra/clamav-scanner image; the app reaches both over
# the network via S3_* and CLAMAV_* in .env.prod (ADR 0012, docs/cloud-environment/deploy-storage-and-scanning.md).
#
#   cp .env.prod.example .env.prod      # then fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: loop-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published to the host: only the app and migrate containers reach it on the compose network.

  # One-shot: applies pending Prisma migrations, then exits. Never seeds.
  migrate:
    build:
      context: .
      target: migrate
    image: loop-migrate:${LOOP_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    image: loop:${LOOP_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      APP_ROLE: all
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Fail fast at compose time if the external services are not configured (the app also enforces this at boot).
      S3_REGION: ${S3_REGION:?set S3_REGION in .env.prod}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env.prod}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env.prod}
      CLAMAV_URL: ${CLAMAV_URL:?set CLAMAV_URL in .env.prod}
      CLAMAV_AUTH_TOKEN: ${CLAMAV_AUTH_TOKEN:?set CLAMAV_AUTH_TOKEN in .env.prod}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
