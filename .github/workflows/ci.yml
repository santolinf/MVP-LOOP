name: ci
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @loop/db generate
      - run: pnpm lint && pnpm typecheck && pnpm test

  security:
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits through the API, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Dependency audit: fail on high or critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high
      # Licence check: production dependencies must be permissively licensed (tool is run ad hoc, not installed).
      - run: >
          npx --yes license-checker-rseidelsohn@4 --production --summary --excludePrivatePackages
          --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;BlueOak-1.0.0;CC0-1.0;CC-BY-4.0;Python-2.0;MIT-0;Unlicense;MPL-2.0;LGPL-3.0-or-later;(MIT OR CC0-1.0);(MIT AND Zlib)"
      # Secret scanning over the full history.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
