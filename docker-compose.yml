services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build: ./infra/minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - "miniodata:/data"

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  # Same scanner image and HTTP contract as production (ADR 0012). First start downloads signatures, so /healthz
  # stays 503 for a minute or two. The token matches the dev default in apps/api/src/config.
  clamav-scanner:
    build: ./infra/clamav-scanner
    ports: ["8080:8080"]
    environment:
      AUTH_TOKEN: dev-only-clamav-token-0123456789abcdef

volumes:
  pgdata:
  miniodata:
